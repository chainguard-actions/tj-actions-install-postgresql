name: Test PostgreSQL connectivity after installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Ensure prerequisites are available
        run: |
          # Ensure lsb_release and wget are available (needed by entrypoint.sh)
          if ! command -v lsb_release &>/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq lsb-release
          fi
          if ! command -v wget &>/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq wget
          fi
      - id: action
        uses: .
        with:
          postgresql-version: '15'
      - name: Assert PostgreSQL 15 is installed and correct version
        run: |
          POSTGRESQL_VERSION=$(psql --version | awk '{print $3}')
          echo "Installed PostgreSQL version: $POSTGRESQL_VERSION"
          if [[ "$POSTGRESQL_VERSION" != "15."* ]]; then
            echo "FAIL: expected version 15.x but got $POSTGRESQL_VERSION"
            exit 1
          fi
          echo "PASS: PostgreSQL $POSTGRESQL_VERSION installed successfully"
      - name: Assert PostgreSQL service is running and accepting connections
        run: |
          echo "Checking PostgreSQL service status..."
          # Start the PostgreSQL service if not already running
          sudo service postgresql start || true
          sleep 2
          if pg_isready -q; then
            echo "PASS: PostgreSQL is ready and accepting connections"
          else
            echo "FAIL: PostgreSQL is not ready"
            exit 1
          fi
