name: Test PostgreSQL installation version 14
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          postgresql-version: "14"
      - name: Assert PostgreSQL 14 is installed and on PATH
        run: |
          echo "Checking psql version..."
          POSTGRESQL_VERSION=$(psql --version | awk '{print $3}')
          echo "Installed version: $POSTGRESQL_VERSION"
          if [[ "$POSTGRESQL_VERSION" != "14."* ]]; then
            echo "FAIL: expected version 14.x but got $POSTGRESQL_VERSION"
            exit 1
          fi
          echo "PASS: PostgreSQL $POSTGRESQL_VERSION installed successfully"
      - name: Assert pg_isready is available
        run: |
          if ! command -v pg_isready &>/dev/null; then
            echo "FAIL: pg_isready not found on PATH"
            exit 1
          fi
          echo "PASS: pg_isready is available at $(command -v pg_isready)"
