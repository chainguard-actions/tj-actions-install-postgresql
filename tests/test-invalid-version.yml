name: Test invalid PostgreSQL version (out of range)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          postgresql-version: "99"
      - name: Assert action failed for out-of-range version
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail for version 99 (out of range 10-15), but got outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed for invalid version 99"
